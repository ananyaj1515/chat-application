name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x   # match your actual version

      - name: Restore server
        run: dotnet restore server/server.csproj

      - name: Build server
        run: dotnet build server/server.csproj --no-restore

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore client
        run: dotnet restore client/client.csproj

      - name: Build client
        run: dotnet build client/client.csproj --no-restore
